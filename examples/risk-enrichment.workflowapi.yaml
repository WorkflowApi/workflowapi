workflowApi: 0.1.0
info:
  title: Risk Service Workflow API
  version: 1.0.0
  summary: Durable workflows for company risk enrichment and approval.
  description: >-
    Describes the declared WorkflowAPI surface for the Risk Service, including
    externally callable workflow operations, child workflows, internal subflows,
    bridges, schemas, and Temporal binding metadata.

host:
  id: risk-service
  name: Risk Service
  owner:
    team: B2B Risk Engineering
    contact: risk-service@example.internal
  environment: prod
  baseUrl: https://risk-service.example.internal

bindings:
  temporal:
    namespace: B2B.RiskService
    taskQueue: risk-enrichment
    webUrl: https://temporal.example.internal/namespaces/B2B.RiskService
    workerHost: risk-worker
    sdk: temporal-dotnet

workflows:
  RiskEnrichmentWorkflow:
    name: RiskEnrichmentWorkflow
    displayName: Risk enrichment workflow
    summary: Enriches a company, calculates risk, creates an audit trail, and publishes the result.
    version: v1
    tags: [risk, enrichment, dnb]
    run:
      operationId: runRiskEnrichment
      input:
        $ref: '#/components/schemas/RiskEnrichmentRequest'
      output:
        $ref: '#/components/schemas/RiskEnrichmentResult'
    signals:
      Cancel:
        summary: Requests cancellation of the enrichment run.
        input:
          $ref: '#/components/schemas/CancelSignal'
      ManualReviewBypassed:
        summary: Indicates that manual review has been bypassed by an authorised user.
        input:
          $ref: '#/components/schemas/ManualReviewBypassedSignal'
    queries:
      GetStatus:
        summary: Returns the current business status of the enrichment workflow.
        output:
          $ref: '#/components/schemas/RiskEnrichmentStatus'
    updates:
      RefreshRiskModel:
        summary: Re-runs the risk model with updated scoring parameters.
        input:
          $ref: '#/components/schemas/RiskModelRefreshRequest'
        output:
          $ref: '#/components/schemas/RiskEnrichmentResult'

    topology:
      nodes:
        start:
          kind: start
          displayName: Start
        identify-company:
          kind: activity
          displayName: Identify company
          activityRef: IdentifyCompanyActivity
          summary: Resolves company identifiers and normalises address data.
        enrich-dnb-data:
          kind: bridge
          displayName: Enrich D&B data
          bridgeRef: bridges.Dnb.EnrichCompany
          summary: Calls an external D&B enrichment bridge.
        calculate-risk:
          kind: childWorkflow
          displayName: Calculate risk
          workflowRef: CalculateRiskWorkflow
          summary: Runs scoring as a nested child workflow.
        document-pdf:
          kind: bridge
          displayName: Generate PDF
          bridgeRef: bridges.DocumentService.GeneratePdf
          summary: Requests PDF generation from the Document Service.
        publish-result:
          kind: activity
          displayName: Publish result
          activityRef: PublishRiskResultActivity
          summary: Publishes the final risk result to downstream systems.
        end:
          kind: end
          displayName: End
      edges:
        - from: start
          to: identify-company
        - from: identify-company
          to: enrich-dnb-data
        - from: enrich-dnb-data
          to: calculate-risk
        - from: calculate-risk
          to: document-pdf
        - from: document-pdf
          to: publish-result
        - from: publish-result
          to: end

  CalculateRiskWorkflow:
    name: CalculateRiskWorkflow
    displayName: Calculate risk child workflow
    summary: Scores company risk using financial, behavioural, and compliance signals.
    visibility: internal
    parentWorkflows:
      - RiskEnrichmentWorkflow
    run:
      operationId: runCalculateRisk
      input:
        $ref: '#/components/schemas/CalculateRiskRequest'
      output:
        $ref: '#/components/schemas/RiskScoreResult'
    topology:
      nodes:
        start:
          kind: start
        fetch-signals:
          kind: subflow
          displayName: Fetch signals
          subflowRef: '#/components/subflows/SignalCollectionSubflow'
        score-engine:
          kind: activity
          displayName: Score engine
          activityRef: ScoreCompanyRiskActivity
        external-checks:
          kind: childWorkflow
          displayName: External checks
          workflowRef: ExternalChecksWorkflow
        aggregate:
          kind: activity
          displayName: Aggregate score
          activityRef: AggregateRiskScoreActivity
        end:
          kind: end
      edges:
        - from: start
          to: fetch-signals
        - from: fetch-signals
          to: score-engine
        - from: score-engine
          to: external-checks
        - from: external-checks
          to: aggregate
        - from: aggregate
          to: end

  ExternalChecksWorkflow:
    name: ExternalChecksWorkflow
    displayName: External checks child workflow
    summary: Performs compliance and watchlist checks used by the risk model.
    visibility: internal
    parentWorkflows:
      - CalculateRiskWorkflow
    run:
      operationId: runExternalChecks
      input:
        $ref: '#/components/schemas/ExternalChecksRequest'
      output:
        $ref: '#/components/schemas/ExternalChecksResult'
    topology:
      nodes:
        start:
          kind: start
        sanctions-check:
          kind: activity
          displayName: Sanctions check
          activityRef: SanctionsCheckActivity
        pep-check:
          kind: activity
          displayName: PEP check
          activityRef: PoliticallyExposedPersonCheckActivity
        adverse-media:
          kind: activity
          displayName: Adverse media
          activityRef: AdverseMediaCheckActivity
        end:
          kind: end
      edges:
        - from: start
          to: sanctions-check
        - from: sanctions-check
          to: pep-check
        - from: pep-check
          to: adverse-media
        - from: adverse-media
          to: end

components:
  subflows:
    SignalCollectionSubflow:
      summary: Reusable inline subflow that gathers scoring signals before risk calculation.
      nodes:
        fetch-payment-history:
          kind: activity
          displayName: Fetch payment history
          activityRef: FetchPaymentHistoryActivity
        fetch-credit-limit:
          kind: activity
          displayName: Fetch credit limit
          activityRef: FetchCreditLimitActivity
        normalise-signals:
          kind: activity
          displayName: Normalise signals
          activityRef: NormaliseRiskSignalsActivity
      edges:
        - from: fetch-payment-history
          to: fetch-credit-limit
        - from: fetch-credit-limit
          to: normalise-signals
  schemas:
    RiskEnrichmentRequest:
      type: object
      required: [companyId, country]
      properties:
        companyId:
          type: string
        companyName:
          type: string
        country:
          type: string
        duns:
          type: string
        reason:
          type: string
    RiskEnrichmentResult:
      type: object
      required: [companyId, riskClass, status]
      properties:
        companyId:
          type: string
        riskClass:
          type: string
        status:
          type: string
        documentId:
          type: string
    RiskEnrichmentStatus:
      type: object
      properties:
        state:
          type: string
        currentStep:
          type: string
        updatedAt:
          type: string
          format: date-time
    CancelSignal:
      type: object
      properties:
        reason:
          type: string
    ManualReviewBypassedSignal:
      type: object
      properties:
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
    RiskModelRefreshRequest:
      type: object
      properties:
        modelVersion:
          type: string
    CalculateRiskRequest:
      type: object
      properties:
        companyId:
          type: string
        duns:
          type: string
    RiskScoreResult:
      type: object
      properties:
        score:
          type: number
        riskClass:
          type: string
    ExternalChecksRequest:
      type: object
      properties:
        companyId:
          type: string
        country:
          type: string
    ExternalChecksResult:
      type: object
      properties:
        sanctionsHit:
          type: boolean
        pepHit:
          type: boolean
        adverseMediaHit:
          type: boolean

bridges:
  Dnb.EnrichCompany:
    displayName: D&B company enrichment
    kind: external
    summary: Calls the configured D&B enrichment endpoint.
    input:
      $ref: '#/components/schemas/RiskEnrichmentRequest'
    output:
      type: object
      properties:
        duns:
          type: string
        legalName:
          type: string
        creditLimit:
          type: number
  DocumentService.GeneratePdf:
    $ref: './document-service-generate-pdf.bridge.workflowapi.yaml#/bridges/DocumentService.GeneratePdf'
