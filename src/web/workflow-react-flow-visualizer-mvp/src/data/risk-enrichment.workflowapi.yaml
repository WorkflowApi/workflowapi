    namespace: B2B.RiskService
    taskQueue: risk-enrichment
    sdk: temporal-dotnet
workflows:
  CalculateRiskWorkflow:
    name: CalculateRiskWorkflow
    displayName: Calculate risk workflow
    run:
      operationId: Run
    topology:
      nodes:
        start:
          kind: start
          displayName: Start
        fetch-payment-history:
          kind: activity
          displayName: Fetch payment history
          activityRef: FetchPaymentHistoryActivity
        fetch-credit-limit:
          kind: activity
          displayName: Fetch credit limit
          activityRef: FetchCreditLimitActivity
        normalise-risk-signals:
          kind: activity
          displayName: Normalise risk signals
          activityRef: NormaliseRiskSignalsActivity
        score-company-risk:
          kind: activity
          displayName: Score company risk
          activityRef: ScoreCompanyRiskActivity
        external-checks:
          kind: childWorkflow
          displayName: External checks
          workflowRef: ExternalChecksWorkflow
        aggregate-risk-score:
          kind: activity
          displayName: Aggregate risk score
          activityRef: AggregateRiskScoreActivity
        end:
          kind: end
          displayName: End
      edges:
      - from: start
        to: fetch-payment-history
      - from: fetch-payment-history
        to: fetch-credit-limit
      - from: fetch-credit-limit
        to: normalise-risk-signals
      - from: normalise-risk-signals
