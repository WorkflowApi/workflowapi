        operationId: Cancel
    queries:
      GetStatus:
        operationId: GetStatus
    topology:
      nodes:
        start:
          kind: start
          displayName: Start
        identify-company:
          kind: activity
          displayName: Identify company
          activityRef: IdentifyCompanyActivity
        enrich-dnb:
          kind: activity
          displayName: Enrich dnb
          activityRef: EnrichDnbActivity
        calculate-risk:
          kind: childWorkflow
          displayName: Calculate risk
          workflowRef: CalculateRiskWorkflow
        generate-pdf:
          kind: activity
          displayName: Generate pdf
          activityRef: GeneratePdfActivity
        publish-risk-result:
          kind: activity
          displayName: Publish risk result
          activityRef: PublishRiskResultActivity
        end:
          kind: end
          displayName: End
      edges:
      - from: start
        to: identify-company
      - from: identify-company
        to: enrich-dnb
      - from: enrich-dnb
