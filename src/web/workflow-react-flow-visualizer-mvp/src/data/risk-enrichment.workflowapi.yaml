workflowApi: 0.1.0
info:
  title: risk-enrichment Workflow API
  version: 0.1.0
  summary: Generated from .NET Temporal worker registered on task queue 'risk-enrichment'.
host:
  id: risk-enrichment
  name: risk-enrichment
bindings:
