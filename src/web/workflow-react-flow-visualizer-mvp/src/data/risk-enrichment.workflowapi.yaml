          displayName: Sanctions check
          activityRef: SanctionsCheckActivity
        politically-exposed-person-check:
          kind: activity
          displayName: Politically exposed person check
          activityRef: PoliticallyExposedPersonCheckActivity
        adverse-media-check:
          kind: activity
          displayName: Adverse media check
          activityRef: AdverseMediaCheckActivity
        end:
          kind: end
          displayName: End
      edges:
      - from: start
        to: sanctions-check
      - from: sanctions-check
        to: politically-exposed-person-check
      - from: politically-exposed-person-check
        to: adverse-media-check
      - from: adverse-media-check
        to: end
  RiskEnrichmentWorkflow:
    name: RiskEnrichmentWorkflow
    displayName: Risk enrichment workflow
    run:
      operationId: Run
    signals:
